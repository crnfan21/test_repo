name: Protect Branches

on:
  push:
    branches:
      - develop
      - master

jobs:
  check-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check if push is part of a pull request
        run: |
          if [[ $GITHUB_EVENT_NAME != "pull_request" ]]; then
            echo "Direct push to develop or master is not allowed!"
            exit 1
          fi