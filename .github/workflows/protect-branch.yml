name: Protect Branches

on:
  push:
    branches:
      - develop
      - master

jobs:
  undo-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check if push is direct push (not from a pull request)
        run: |
          # Check if the push is a direct push (not from a pull request)
          if [[ -z "$GITHUB_HEAD_REF" ]]; then
            echo "Direct push to develop or master is not allowed!"
          
            # Get the previous commit SHA (before the push)
            PREVIOUS_SHA=$(git rev-parse HEAD^1)
          
            # Force-push to reset the branch to the previous commit (undo the direct push)
            git reset --hard $PREVIOUS_SHA
            git push origin HEAD --force
          
            exit 1
          fi